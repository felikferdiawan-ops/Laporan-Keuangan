<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d4ed8">
<title>Keuangan Garasi Fotocopy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"><\/script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css?v=102">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"><\/script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"><\/script>
</head>
<body class="bg-slate-200 text-slate-800 min-h-screen flex flex-col">
<header class="bg-blue-700 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <img src="logo.png" onerror="this.src='icon-192.png'" class="w-12 h-12 rounded-full border-2 border-white bg-white object-contain">
      <div>
        <h1 class="font-bold text-base md:text-lg">Keuangan Garasi Fotocopy</h1>
        <div class="flex items-center gap-2 mt-0.5">
          <p class="text-[11px] text-blue-100" id="currentDateDisplay">...</p>
          <span id="syncStatus" class="text-[9px] px-2 py-0.5 rounded-full bg-amber-500 text-white flex items-center gap-1 font-semibold">
            <i class="fa-solid fa-spinner fa-spin"></i> Memuat...
          </span>
        </div>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="bukaModal('modalRekap');renderRekap('hari')" class="bg-white/15 hover:bg-white/25 px-3 py-2 rounded-lg text-xs font-semibold"><i class="fa-solid fa-chart-pie"></i> <span class="hidden sm:inline">Rekap</span></button>
      <button onclick="bukaModal('modalSetelan')" class="bg-white/15 hover:bg-white/25 px-3 py-2 rounded-lg text-xs font-semibold"><i class="fa-solid fa-gear"></i> <span class="hidden sm:inline">Setelan</span></button>
    </div>
  </div>
</header>
<main class="max-w-4xl mx-auto px-4 pt-6 space-y-6 flex-grow w-full">
  <section class="bg-slate-50 rounded-2xl p-5 shadow-md border border-slate-300">
    <div class="bg-gradient-to-r from-blue-700 to-indigo-700 rounded-xl p-5 text-white mb-4 flex justify-between items-center">
      <div><p class="text-xs text-blue-100 font-semibold">💰 Total Saldo Utama</p><h2 class="text-2xl md:text-3xl font-extrabold" id="valSaldoUtama">Rp 0</h2></div>
      <span class="p-3 bg-white/10 rounded-xl"><i class="fa-solid fa-wallet text-2xl"></i></span>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-3">
      <div class="bg-white border rounded-xl p-3.5"><span class="text-xs text-slate-500 font-semibold">💵 Saldo Tunai</span><p class="text-lg font-bold mt-2" id="valSaldoTunai">Rp 0</p></div>
      <div class="bg-white border rounded-xl p-3.5"><span class="text-xs text-slate-500 font-semibold">🏦 Rekening Bank</span><p class="text-lg font-bold mt-2" id="valSaldoBank">Rp 0</p></div>
    </div>
    <div class="bg-amber-50 border border-amber-300 rounded-xl p-3.5 mb-3 flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="p-2 bg-amber-500 text-white rounded-lg"><i class="fa-solid fa-briefcase"></i></div>
        <div><p class="text-xs font-bold text-amber-800">💼 Kas Laci Awal</p><p class="text-lg font-extrabold" id="valKasLaciAwal">Rp 0</p></div>
      </div>
      <button onclick="bukaModal('modalKasLaci')" class="text-xs bg-white border border-amber-400 text-amber-800 font-semibold px-3 py-1.5 rounded-lg">Atur Kas</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="bg-emerald-50 border border-emerald-300 rounded-xl p-3"><p class="text-xs font-semibold text-emerald-800">📅 Bersih Tunai</p><p class="font-bold mt-1" id="valBersihHariIni">Rp 0</p></div>
      <div class="bg-sky-50 border border-sky-300 rounded-xl p-3"><p class="text-xs font-semibold text-sky-800">📱 QRIS Hari Ini</p><p class="font-bold mt-1" id="valQrisHariIni">Rp 0</p></div>
      <div class="bg-indigo-50 border border-indigo-300 rounded-xl p-3"><p class="text-xs font-semibold text-indigo-800">💳 Transfer Hari Ini</p><p class="font-bold mt-1" id="valTransferHariIni">Rp 0</p></div>
    </div>
  </section>
  <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <button onclick="bukaModal('modalTransaksiTunai')" class="bg-slate-50 p-4 rounded-xl border shadow text-left hover:border-emerald-500"><i class="fa-solid fa-cash-register text-emerald-600 text-xl mb-2"></i><h3 class="font-bold text-sm">Kasir Tunai</h3><p class="text-[11px] text-slate-500">Pemasukan & Pengeluaran</p></button>
    <button onclick="bukaModal('modalTransaksiDigital')" class="bg-slate-50 p-4 rounded-xl border shadow text-left hover:border-blue-500"><i class="fa-solid fa-qrcode text-blue-600 text-xl mb-2"></i><h3 class="font-bold text-sm">QRIS / Transfer</h3><p class="text-[11px] text-slate-500">Pending harian</p></button>
    <button onclick="bukaModal('modalSaldoManual')" class="bg-slate-50 p-4 rounded-xl border shadow text-left hover:border-purple-500"><i class="fa-solid fa-sliders text-purple-600 text-xl mb-2"></i><h3 class="font-bold text-sm">Saldo Manual</h3><p class="text-[11px] text-slate-500">Modal / Prive</p></button>
    <button onclick="bukaModal('modalSetorkan')" class="bg-slate-50 p-4 rounded-xl border shadow text-left hover:border-amber-500"><i class="fa-solid fa-hand-holding-dollar text-amber-600 text-xl mb-2"></i><h3 class="font-bold text-sm">Setorkan Kas</h3><p class="text-[11px] text-slate-500">Tunai & Bank</p></button>
  </section>
  <section class="bg-slate-50 rounded-2xl shadow border overflow-hidden mb-8">
    <div class="px-5 py-4 border-b bg-slate-100 flex justify-between"><h3 class="font-bold"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</h3><span id="totalTransaksi" class="text-xs bg-slate-200 px-2 py-1 rounded">0</span></div>
    <div class="overflow-x-auto max-h-96 bg-white">
      <table class="w-full text-xs md:text-sm text-left">
        <thead class="bg-slate-50 sticky top-0 border-b"><tr><th class="py-3 px-4">Waktu</th><th class="py-3 px-4">Kategori</th><th class="py-3 px-4">Keterangan</th><th class="py-3 px-4 text-right">Nominal</th><th class="py-3 px-4 text-center">Aksi</th></tr></thead>
        <tbody id="tbodyRiwayat"></tbody>
      </table>
    </div>
  </section>
</main>
<footer class="py-6 text-center text-xs text-slate-500 font-semibold">dibuat oleh <span class="text-blue-700 font-bold">GARASI FOTOCOPY</span></footer>

<!-- MODALS (sama seperti sebelumnya) -->
<div id="modalKasLaci" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3"><h3 class="font-bold text-lg">💼 Kas Laci Awal</h3><form onsubmit="handleKasLaciAwal(event)" class="space-y-3"><input type="number" id="inputKasLaci" required min="1" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Nominal"><div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalKasLaci')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button type="submit" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-xs font-semibold">Simpan</button></div></form></div></div>
<div id="modalTransaksiTunai" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto"><h3 class="font-bold text-lg">💵 Kasir Tunai</h3><form onsubmit="handleTransaksiTunai(event)" class="space-y-3">
<select id="inputJenisTunai" onchange="toggleKategoriTunai()" class="w-full border rounded-lg p-2.5 text-sm"><option value="MASUK">Pemasukan</option><option value="KELUAR">Pengeluaran</option></select>
<div id="containerKategoriTunai" class="hidden space-y-2"><select id="inputKategoriTunai" class="w-full border rounded-lg p-2.5 text-sm"></select>
<select id="inputSumberDanaTunai" class="w-full border rounded-lg p-2.5 text-sm"><option value="TUNAI">Potong Tunai</option><option value="BANK">Potong Bank</option></select></div>
<input type="text" id="inputKetTunai" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Keterangan (opsional)">
<input type="number" id="inputNominalTunai" required min="1" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Nominal">
<div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalTransaksiTunai')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Simpan</button></div>
</form></div></div>
<div id="modalTransaksiDigital" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3"><h3 class="font-bold text-lg">📱 Digital</h3><form onsubmit="handleTransaksiDigital(event)" class="space-y-3">
<select id="inputMetodeDigital" class="w-full border rounded-lg p-2.5 text-sm"><option value="QRIS">QRIS</option><option value="TRANSFER">Transfer</option></select>
<input type="text" id="inputKetDigital" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Keterangan">
<input type="number" id="inputNominalDigital" required min="1" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Nominal">
<div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalTransaksiDigital')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Simpan</button></div>
</form></div></div>
<div id="modalSaldoManual" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3"><h3 class="font-bold text-lg">💳 Saldo Manual</h3><form onsubmit="handleSaldoManual(event)" class="space-y-3">
<select id="inputAkunManual" class="w-full border rounded-lg p-2.5 text-sm"><option value="TUNAI">Tunai</option><option value="BANK">Bank</option></select>
<select id="inputAksiManual" class="w-full border rounded-lg p-2.5 text-sm"><option value="TAMBAH">Tambah</option><option value="KURANG">Kurangi</option></select>
<input type="text" id="inputKetManual" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Setoran Modal jika kosong">
<input type="number" id="inputNominalManual" required min="1" class="w-full border rounded-lg p-2.5 text-sm" placeholder="Nominal">
<div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalSaldoManual')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-xs font-semibold">Eksekusi</button></div>
</form></div></div>
<div id="modalSetorkan" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3">
<h3 class="font-bold text-lg text-amber-700">Tutup Kasir & Setor</h3>
<div class="bg-slate-50 border rounded-xl p-3 text-xs space-y-2">
  <div class="border-b pb-2 space-y-1"><p class="font-bold">💵 ke Saldo Tunai</p>
    <div class="flex justify-between pl-2"><span>Kas Laci</span><strong id="setorKasLaci">Rp 0</strong></div>
    <div class="flex justify-between pl-2"><span>Bersih</span><strong id="setorBersih">Rp 0</strong></div>
    <div class="flex justify-between pl-2 font-bold text-emerald-700"><span>Subtotal</span><span id="setorTunaiTotal">Rp 0</span></div></div>
  <div class="border-b pb-2 space-y-1"><p class="font-bold">🏦 ke Rekening</p>
    <div class="flex justify-between pl-2"><span>QRIS</span><strong id="setorQris">Rp 0</strong></div>
    <div class="flex justify-between pl-2"><span>Transfer</span><strong id="setorTransfer">Rp 0</strong></div>
    <div class="flex justify-between pl-2 font-bold text-blue-700"><span>Subtotal</span><span id="setorBankTotal">Rp 0</span></div></div>
  <div class="flex justify-between font-extrabold"><span>Total</span><span id="setorTotal">Rp 0</span></div>
</div>
<div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalSetorkan')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button onclick="eksekusiSetorkan()" class="px-4 py-2 bg-amber-500 text-white rounded-lg text-xs font-semibold">Setorkan</button></div>
</div></div>
<div id="modalRekap" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 max-h-[95vh] overflow-y-auto">
<div class="flex justify-between"><h3 class="font-bold"><i class="fa-solid fa-chart-pie text-blue-600"></i> Rekap</h3><button onclick="tutupModal('modalRekap')"><i class="fa-solid fa-xmark text-xl"></i></button></div>
<div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-lg">
<button onclick="renderRekap('hari')" id="btnRekapHari" class="tab-rekap py-2 text-xs font-semibold">Hari Ini</button>
<button onclick="renderRekap('minggu')" id="btnRekapMinggu" class="tab-rekap py-2 text-xs font-semibold">7 Hari</button>
<button onclick="renderRekap('bulan')" id="btnRekapBulan" class="tab-rekap py-2 text-xs font-semibold">Bulanan</button>
</div>
<div style="height:250px"><canvas id="chartRekap"></canvas></div>
<div class="grid grid-cols-3 gap-2">
<div class="bg-blue-50 border rounded-xl p-3 text-center"><p class="text-[11px] text-blue-700 font-semibold">Masuk</p><p id="rekapMasuk" class="font-bold text-sm">Rp 0</p></div>
<div class="bg-rose-50 border rounded-xl p-3 text-center"><p class="text-[11px] text-rose-700 font-semibold">Keluar</p><p id="rekapKeluar" class="font-bold text-sm">Rp 0</p></div>
<div class="bg-emerald-50 border rounded-xl p-3 text-center"><p class="text-[11px] text-emerald-700 font-semibold">Sisa</p><p id="rekapSisa" class="font-bold text-sm">Rp 0</p></div>
</div></div></div>
<div id="modalSetelan" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3">
<div class="flex justify-between"><h3 class="font-bold">Setelan</h3><button onclick="tutupModal('modalSetelan')"><i class="fa-solid fa-xmark"></i></button></div>
<button onclick="backupData()" class="w-full text-left p-3 border rounded-lg hover:bg-blue-50 text-sm font-semibold">Backup JSON</button>
<label class="w-full block p-3 border rounded-lg hover:bg-emerald-50 text-sm font-semibold cursor-pointer">Restore JSON<input type="file" accept=".json" class="hidden" onchange="restoreData(event)"></label>
<button onclick="resetAplikasi()" class="w-full text-left p-3 border border-rose-200 rounded-lg hover:bg-rose-50 text-sm font-semibold text-rose-700">Reset ke Rp 0</button>
</div></div>
<div id="modalEdit" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3">
<h3 class="font-bold">✏️ Edit</h3>
<form onsubmit="handleEditRiwayat(event)" class="space-y-3">
<input type="hidden" id="editId">
<input type="text" id="editKet" required class="w-full border rounded-lg p-2.5 text-sm">
<input type="number" id="editNominal" required min="1" class="w-full border rounded-lg p-2.5 text-sm">
<div class="flex justify-end gap-2"><button type="button" onclick="tutupModal('modalEdit')" class="px-4 py-2 border rounded-lg text-xs">Batal</button><button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Simpan</button></div>
</form></div></div>
<script src="app.js?v=102"><\/script>
</body></html>
